# General ##################################################################
# set -g default-terminal "screen-256color"
# set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0                       # address vim mode switching delay
set -g history-limit 50000                 # increase scrollback buffer size
set -g status-interval 5                   # update status every 5 seconds
set -g mode-keys vi                        # vi keybinding
set -g focus-events on                     # focus events enabled for terminals that support them
set -g base-index 1                        # start windows numbering at 1
set -g renumber-windows on                 # renumber windows when a window is closed
set -g detach-on-destroy off               # after kill-session, go to another session (do not detach)
setw -g pane-base-index 1                  # make pane numbering consistent with windows
setw -g aggressive-resize on               # useful when using "grouped sessions" and multi-monitor

set -s extended-keys on                    # pass extended keys (e.g. Ctrl+/) to apps like nvim

# change default prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# vim keybinding in select mode
bind / copy-mode \; send-key ?
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded."

# Sessions
bind S command-prompt -I "~/" -p "Session directory:" {
  run-shell 'd=$(printf %s "%1" | sed "s|^~|$HOME|"); n=$(basename "$d" | tr ".:" "__"); tmux has-session -t "=$n" 2>/dev/null || tmux new-session -d -s "$n" -c "$d"; tmux switch-client -c "#{client_name}" -t "=$n"'
}
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind , choose-session

# Tabs
bind r command-prompt -I "#W" -p "Rename tab:" { rename-window "%%" }   # rename the current window (tab)
bind C-p previous-window
bind C-n next-window
bind T split-window -l 15 -c "#{pane_current_path}"
bind N swap-window -t +1\; select-window -t +1
bind P swap-window -t -1\; select-window -t -1

# Panes
bind m display-panes -d 0 { select-pane -m ; swap-pane -t "%%" ; select-pane -t "{marked}" ; select-pane -M }
bind f resize-pane -Z
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4
bind-key @ command-prompt -p "Send pane to:"  "join-pane -t '%%'"

# Theme & plugin ###########################################################
source-file ~/.config/tmux/catppuccin-frappe.tmux
